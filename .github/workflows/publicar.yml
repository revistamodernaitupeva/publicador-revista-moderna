name: Publicar
on:
  schedule:
    - cron: "7,17,27,37,47,57 9-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      simulacao:
        description: "Simular (nao publica de verdade)?"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar o que esta na hora
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_ALTOURUGUAI: ${{ secrets.META_TOKEN_ALTOURUGUAI }}
          WP_USUARIO: ${{ secrets.WP_USUARIO }}
          WP_SENHA: ${{ secrets.WP_SENHA }}
          SIMULACAO: ${{ inputs.simulacao || 'false' }}
        run: python3 publicar.py

      - name: Preparar stories automaticos
        if: always()
        env:
          SIMULACAO: ${{ inputs.simulacao || 'false' }}
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          python3 stories_auto.py

      - name: Salvar alteracoes no repositorio
        if: always()
        run: |
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada a salvar."
          else
            git commit -m "Publicador: atualiza fila e historico"
            git pull --rebase
            git push
          fi
