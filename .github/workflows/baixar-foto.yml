name: Baixar foto
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereço https da imagem (só domínios de config.json > dominios_foto)"
        required: true
      nome:
        description: "Nome do arquivo, sem extensão (letras minúsculas, números e hífen)"
        required: true

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar a imagem
        env:
          FOTO_URL: ${{ inputs.url }}
          FOTO_NOME: ${{ inputs.nome }}
        run: python3 baixar_foto.py

      - name: Salvar no repositorio
        run: |
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add fotos
          if git diff --cached --quiet; then
            echo "Nada a salvar."
          else
            git commit -m "Foto baixada: ${FOTO_NOME}"
            for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((RANDOM % 8 + 3)); done
          fi
        env:
          FOTO_NOME: ${{ inputs.nome }}
